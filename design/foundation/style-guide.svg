<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1160" viewBox="0 0 1280 1160">
  <defs>
    <linearGradient id="btnCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="btnRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="1160" fill="#0F172A"/>
  <g font-family="Inter, Segoe UI, sans-serif">

    <text x="40" y="54" font-size="24" font-weight="800" fill="#22D3EE">GROQuiz — Design foundations</text>
    <text x="40" y="80" font-size="13" fill="#94A3B8">Copy these tokens into Figma Variables. Dark theme, "professional but fun".</text>

    <!-- COLORS -->
    <text x="40" y="122" font-size="14" font-weight="700" fill="#E2E8F0">Colors</text>
    <g font-size="10" font-weight="600">
      <!-- row 1 -->
      <rect x="40" y="136" width="88" height="66" rx="12" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/><text x="84" y="190" text-anchor="middle" fill="#94A3B8">#0F172A</text>
      <rect x="140" y="136" width="88" height="66" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/><text x="184" y="190" text-anchor="middle" fill="#94A3B8">#1E293B</text>
      <rect x="240" y="136" width="88" height="66" rx="12" fill="#16202F" stroke="#334155" stroke-width="1.5"/><text x="284" y="190" text-anchor="middle" fill="#94A3B8">#16202F</text>
      <rect x="340" y="136" width="88" height="66" rx="12" fill="#334155" stroke="#334155" stroke-width="1.5"/><text x="384" y="190" text-anchor="middle" fill="#0F172A">#334155</text>
      <rect x="440" y="136" width="88" height="66" rx="12" fill="#E2E8F0" stroke="#334155" stroke-width="1.5"/><text x="484" y="190" text-anchor="middle" fill="#0F172A">#E2E8F0</text>
      <rect x="540" y="136" width="88" height="66" rx="12" fill="#94A3B8" stroke="#334155" stroke-width="1.5"/><text x="584" y="190" text-anchor="middle" fill="#0F172A">#94A3B8</text>
      <rect x="640" y="136" width="88" height="66" rx="12" fill="#64748B" stroke="#334155" stroke-width="1.5"/><text x="684" y="190" text-anchor="middle" fill="#0F172A">#64748B</text>
      <rect x="740" y="136" width="88" height="66" rx="12" fill="#22D3EE" stroke="#22D3EE" stroke-width="1.5"/><text x="784" y="190" text-anchor="middle" fill="#0F172A">#22D3EE</text>
      <rect x="840" y="136" width="88" height="66" rx="12" fill="#34D399" stroke="#34D399" stroke-width="1.5"/><text x="884" y="190" text-anchor="middle" fill="#0F172A">#34D399</text>
      <rect x="940" y="136" width="88" height="66" rx="12" fill="#F87171" stroke="#F87171" stroke-width="1.5"/><text x="984" y="190" text-anchor="middle" fill="#0F172A">#F87171</text>
      <rect x="1040" y="136" width="88" height="66" rx="12" fill="#FBBF24" stroke="#FBBF24" stroke-width="1.5"/><text x="1084" y="190" text-anchor="middle" fill="#0F172A">#FBBF24</text>
      <rect x="1140" y="136" width="88" height="66" rx="12" fill="#A78BFA" stroke="#A78BFA" stroke-width="1.5"/><text x="1184" y="190" text-anchor="middle" fill="#0F172A">#A78BFA</text>
    </g>
    <text x="40" y="236" font-size="10" fill="#64748B">bg · surface · surface-2 · border · text · muted · faint · cyan (action/select) · emerald (correct) · red (wrong) · amber (hints) · violet (AI)</text>

    <!-- TYPE -->
    <text x="40" y="272" font-size="14" font-weight="700" fill="#E2E8F0">Type — Inter</text>
    <g>
      <text x="40" y="304" font-size="11" fill="#64748B">Display 28/800</text><text x="160" y="312" font-size="28" font-weight="800" fill="#E2E8F0">Quiz complete! 🎉</text>
      <text x="40" y="342" font-size="11" fill="#64748B">Headline 20/700</text><text x="160" y="348" font-size="20" font-weight="700" fill="#E2E8F0">If a person's blood cannot deliver oxygen…</text>
      <text x="40" y="382" font-size="11" fill="#64748B">Body 15/400</text><text x="160" y="386" font-size="15" fill="#E2E8F0">Turn any PDF or text into a quiz you'll actually enjoy.</text>
      <text x="40" y="422" font-size="11" fill="#64748B">Small 13/500</text><text x="160" y="424" font-size="13" fill="#94A3B8">Starts Medium and gets Easier/Harder based on your answers.</text>
      <text x="40" y="462" font-size="11" fill="#64748B">Tiny 11/600</text><text x="160" y="462" font-size="11" font-weight="600" fill="#64748B">HINTS ACTIVE — SCORE DROPS 25% PER HINT</text>
      <text x="40" y="502" font-size="11" fill="#64748B">Mono 15/700</text><text x="160" y="504" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#09B9CE">0:24</text>
    </g>

    <!-- SPACING + RADII -->
    <text x="40" y="538" font-size="14" font-weight="700" fill="#E2E8F0">Spacing &amp; radii</text>
    <g font-size="10" font-weight="600" fill="#94A3B8">
      <rect x="40" y="550" width="28" height="28" rx="6" fill="#22D3EE"/><text x="76" y="568">4</text>
      <rect x="40" y="582" width="12" height="56" fill="#22D3EE"/><text x="60" y="612">8</text>
      <rect x="90" y="582" width="64" height="56" fill="#22D3EE"/><text x="162" y="612">16</text>
      <rect x="204" y="582" width="80" height="56" fill="#22D3EE"/><text x="294" y="612">20</text>
      <rect x="330" y="582" width="96" height="56" fill="#22D3EE"/><text x="438" y="612">24</text>
      <rect x="470" y="582" width="128" height="56" fill="#22D3EE"/><text x="612" y="612">32</text>
      <text x="650" y="600">radii:</text>
      <rect x="700" y="585" width="36" height="36" rx="8" fill="none" stroke="#334155" stroke-width="2"/><text x="746" y="609">8</text>
      <rect x="760" y="585" width="36" height="36" rx="16" fill="none" stroke="#334155" stroke-width="2"/><text x="806" y="609">16</text>
      <rect x="820" y="585" width="36" height="36" rx="20" fill="none" stroke="#334155" stroke-width="2"/><text x="866" y="609">20</text>
      <rect x="880" y="585" width="42" height="42" rx="21" fill="none" stroke="#334155" stroke-width="2"/><text x="932" y="609">full</text>
    </g>

    <!-- BUTTONS & PILLS -->
    <text x="40" y="672" font-size="14" font-weight="700" fill="#E2E8F0">Buttons, pills &amp; badges</text>
    <g font-size="13" font-weight="600">
      <rect x="40" y="686" width="172" height="44" rx="14" fill="url(#btnCyan)"/><text x="126" y="713" text-anchor="middle" fill="#061821">Primary</text>
      <rect x="224" y="686" width="172" height="44" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/><text x="310" y="713" text-anchor="middle" fill="#CBD5E1">Outline</text>
      <rect x="408" y="686" width="172" height="44" rx="14" fill="#1E293B"/><text x="494" y="713" text-anchor="middle" fill="#CBD5E1">Ghost</text>
      <rect x="592" y="686" width="172" height="44" rx="14" fill="#0A0F17" stroke="#1E293B" stroke-width="1.5"/><text x="678" y="713" text-anchor="middle" fill="#475569">Disabled</text>
      <circle cx="820" cy="708" r="7" fill="#34D399"/><rect x="838" y="690" width="196" height="36" rx="16" fill="#0B1C14" stroke="#14532D" stroke-width="1.5"/><text x="936" y="713" text-anchor="middle" font-size="12" fill="#6EE7B7">status pill: ready</text>
      <circle cx="1070" cy="708" r="7" fill="#F87171"/><rect x="1088" y="690" width="172" height="36" rx="16" fill="#211515" stroke="#7F1D1D" stroke-width="1.5"/><text x="1174" y="713" text-anchor="middle" font-size="12" fill="#FCA5A5">status pill: off</text>
    </g>
    <g font-size="12" font-weight="700">
      <rect x="40" y="746" width="118" height="34" rx="12" fill="#0B1C14" stroke="#14532D" stroke-width="1.5"/><text x="99" y="768" text-anchor="middle" fill="#34D399">✓ Correct</text>
      <rect x="168" y="746" width="122" height="34" rx="12" fill="#211515" stroke="#7F1D1D" stroke-width="1.5"/><text x="229" y="768" text-anchor="middle" fill="#F87171">✗ Incorrect</text>
      <rect x="300" y="746" width="120" height="34" rx="12" fill="#0B4660" stroke="#22D3EE" stroke-width="1.5"/><text x="360" y="768" text-anchor="middle" fill="#67E8F9">Retry</text>
      <rect x="430" y="746" width="130" height="34" rx="12" fill="#3A2F0B" stroke="#92400E" stroke-width="1.5"/><text x="495" y="768" text-anchor="middle" fill="#FDE68A">◇ Hint</text>
    </g>

    <!-- OPTION STATES -->
    <text x="40" y="830" font-size="14" font-weight="700" fill="#E2E8F0">Option row states</text>
    <g font-size="13" font-weight="500">
      <rect x="40" y="844" width="560" height="48" rx="14" fill="#121A28" stroke="#334155" stroke-width="1.5"/>
      <circle cx="66" cy="868" r="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/><text x="66" y="872" text-anchor="middle" font-size="10" font-weight="700" fill="#94A3B8">A</text>
      <text x="88" y="872" fill="#E2E8F0">Default</text>
      <rect x="40" y="902" width="560" height="48" rx="14" fill="#0B3B4A" stroke="#22D3EE" stroke-width="2"/>
      <circle cx="66" cy="926" r="12" fill="#155E75" stroke="#22D3EE" stroke-width="1.5"/><text x="66" y="930" text-anchor="middle" font-size="10" font-weight="700" fill="#A5F3FC">B</text>
      <text x="88" y="930" font-weight="600" fill="#A5F3FC">Selected (cyan)</text>
      <rect x="40" y="960" width="560" height="40" rx="14" fill="#0F1721" stroke="#1E293B" stroke-width="1.5" opacity="0.55"/>
      <text x="88" y="985" fill="#64748B">Eliminated by 50/50 (smaller + faded, never green)</text>
      <rect x="40" y="1010" width="560" height="48" rx="14" fill="#0E2118" stroke="#14532D" stroke-width="1.5"/>
      <text x="88" y="1038" font-weight="600" fill="#6EE7B7">Correct (emerald ✓ after answering)</text>
      <rect x="40" y="1068" width="560" height="48" rx="14" fill="#211515" stroke="#7F1D1D" stroke-width="1.5"/>
      <text x="88" y="1096" font-weight="600" fill="#FCA5A5">Incorrect (red ✗ after answering)</text>
    </g>

    <!-- Right column: timer ring + powerups + coach -->
    <g>
      <text x="680" y="830" font-size="14" font-weight="700" fill="#E2E8F0">Timer &amp; power-ups</text>
      <circle cx="780" cy="930" r="42" fill="none" stroke="#16202F" stroke-width="10"/>
      <circle cx="780" cy="930" r="42" fill="none" stroke="#22D3EE" stroke-width="10" stroke-linecap="round"
              stroke-dasharray="198" stroke-dashoffset="50" transform="rotate(-90 780 930)"/>
      <text x="780" y="936" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="800" fill="#67E8F9">0:24</text>
      <text x="780" y="994" text-anchor="middle" font-size="10" fill="#64748B">turns red under 10s</text>

      <g font-size="12" font-weight="600">
        <rect x="860" y="890" width="152" height="38" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <text x="878" y="914" fill="#FBBF24">⚡</text><text x="898" y="914" fill="#CBD5E1">50/50</text><text x="972" y="914" fill="#64748B">×3</text>
        <rect x="860" y="938" width="152" height="38" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <text x="878" y="962" fill="#22D3EE">◷</text><text x="898" y="962" fill="#CBD5E1">Freeze</text><text x="972" y="962" fill="#64748B">×2</text>
        <rect x="860" y="986" width="152" height="38" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
        <text x="878" y="1010" fill="#A78BFA">◇</text><text x="898" y="1010" fill="#CBD5E1">Clarifier</text><text x="972" y="1010" fill="#64748B">×1</text>
      </g>

      <rect x="1040" y="890" width="200" height="134" rx="16" fill="#170F2E" stroke="#7C3AED" stroke-width="1.5"/>
      <text x="1060" y="920" font-size="13" fill="#C4B5FD">✦</text>
      <text x="1080" y="920" font-size="12" font-weight="800" fill="#DDD6FE">AI Coach</text>
      <text x="1060" y="946" font-size="10.5" fill="#7F7CFF" font-weight="600">COACHING CARD</text>
      <text x="1060" y="968" font-size="10.5" fill="#C4B5FD">Violet surface, sparkle icon,</text>
      <text x="1060" y="984" font-size="10.5" fill="#C4B5FD">short advice paragraph,</text>
      <text x="1060" y="1000" font-size="10.5" fill="#C4B5FD">refresh button.</text>
    </g>

    <text x="40" y="1140" font-size="11" fill="#475569">Built with Groq · GROQuiz — match the app 1:1, restyle don't remove.</text>
  </g>
</svg>