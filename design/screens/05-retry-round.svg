<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="btnCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="900" fill="url(#glow)"/>
  <g font-family="Inter, Segoe UI, sans-serif">

    <!-- Top bar -->
    <g>
      <rect x="392" y="56" width="40" height="40" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="412" y="82" font-size="16" fill="#94A3B8">←</text>
      <text x="640" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#E2E8F0">Retry 1 / 3</text>
      <rect x="788" y="58" width="100" height="36" rx="12" fill="#0E2A33" stroke="#155E75" stroke-width="1.5"/>
      <text x="838" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#67E8F9">460</text>
    </g>

    <!-- Retry banner -->
    <rect x="392" y="112" width="496" height="46" rx="14" fill="#0B3B4A" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="420" cy="135" r="12" fill="#155E75"/>
    <text x="420" y="140" text-anchor="middle" font-size="12" fill="#67E8F9">↺</text>
    <text x="442" y="132" font-size="12.5" font-weight="700" fill="#A5F3FC">Retry round</text>
    <text x="442" y="148" font-size="11" fill="#67E8F9">Missed or timed-out questions, worth half points.</text>

    <!-- Nav chips with retry badge -->
    <g font-size="11" font-weight="600">
      <rect x="392" y="174" width="34" height="30" rx="10" fill="#0E2118" stroke="#14532D" stroke-width="1"/>
      <text x="409" y="193" text-anchor="middle" fill="#34D399">✓</text>
      <rect x="432" y="174" width="34" height="30" rx="10" fill="#0E2118" stroke="#14532D" stroke-width="1"/>
      <text x="449" y="193" text-anchor="middle" fill="#34D399">✓</text>
      <rect x="472" y="174" width="34" height="30" rx="10" fill="#3A1212" stroke="#B91C1C" stroke-width="1.5"/>
      <text x="489" y="193" text-anchor="middle" fill="#F87171">3</text>
      <rect x="512" y="174" width="34" height="30" rx="10" fill="#0B3B4A" stroke="#09B9CE" stroke-width="1.5"/>
      <text x="529" y="197" text-anchor="middle" fill="#67E8F9">R</text>
      <rect x="552" y="174" width="34" height="30" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="569" y="193" text-anchor="middle" fill="#64748B">5</text>
      <rect x="592" y="174" width="34" height="30" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="609" y="193" text-anchor="middle" fill="#64748B">6</text>
      <text x="700" y="193" font-size="11" fill="#64748B" font-weight="500">R = retry (half points)</text>
    </g>

    <!-- Question card -->
    <rect x="392" y="222" width="496" height="536" rx="20" fill="#1A2333" stroke="#334155" stroke-width="1.5"/>

    <rect x="416" y="246" width="368" height="8" rx="4" fill="#122036"/>
    <rect x="416" y="246" width="276" height="8" rx="4" fill="#22D3EE"/>
    <text x="880" y="258" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#09B9CE" text-anchor="end">0:30</text>

    <text x="416" y="290" font-size="11" font-weight="600" fill="#64748B">ANSWER FAST FOR A BIGGER SCORE</text>

    <text x="416" y="330" font-size="20" font-weight="700" fill="#E2E8F0">What is the <tspan fill="#FDE047" text-decoration="underline">systematic</tspan></text>
    <text x="416" y="358" font-size="20" font-weight="700" fill="#E2E8F0">study of the <tspan fill="#FDE047" text-decoration="underline">heart</tspan> called?</text>

    <!-- Hint -->
    <rect x="416" y="380" width="448" height="44" rx="14" fill="#3A2F0B" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="440" cy="402" r="12" fill="#B45309"/>
    <text x="440" y="407" text-anchor="middle" font-size="13" fill="#FDE68A">◇</text>
    <text x="462" y="407" font-size="12.5" fill="#FDE68A">It's the field dedicated to the heart itself and how blood travels.</text>

    <!-- Options -->
    <g>
      <rect x="416" y="440" width="448" height="56" rx="14" fill="#121A28" stroke="#334155" stroke-width="1.5"/>
      <circle cx="442" cy="468" r="13" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="442" y="473" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8">A</text>
      <text x="466" y="473" font-size="14" fill="#E2E8F0">Anatomy</text>

      <rect x="416" y="508" width="448" height="56" rx="14" fill="#121A28" stroke="#334155" stroke-width="1.5"/>
      <circle cx="442" cy="536" r="13" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="442" y="541" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8">B</text>
      <text x="466" y="541" font-size="14" fill="#E2E8F0">Physiology</text>

      <rect x="416" y="576" width="448" height="56" rx="14" fill="#0B3B4A" stroke="#22D3EE" stroke-width="2"/>
      <circle cx="442" cy="604" r="13" fill="#155E75" stroke="#22D3EE" stroke-width="1.5"/>
      <text x="442" y="609" text-anchor="middle" font-size="11" font-weight="700" fill="#A5F3FC">C</text>
      <text x="466" y="609" font-size="14" font-weight="600" fill="#A5F3FC">Cardiology</text>

      <rect x="416" y="644" width="448" height="56" rx="14" fill="#121A28" stroke="#334155" stroke-width="1.5"/>
      <circle cx="442" cy="672" r="13" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="442" y="677" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8">D</text>
      <text x="466" y="677" font-size="14" fill="#E2E8F0">Pathology</text>
    </g>

    <rect x="416" y="712" width="448" height="40" rx="14" fill="url(#btnCyan)"/>
    <text x="640" y="737" text-anchor="middle" font-size="14.5" font-weight="700" fill="#061821">Confirm Answer · +25 pts</text>
  </g>
</svg>