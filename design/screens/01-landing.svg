<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1400" viewBox="0 0 1280 1400">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="btnCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="1400" fill="url(#glow)"/>
  <g font-family="Inter, Segoe UI, sans-serif">

    <!-- Brand -->
    <text x="640" y="64" text-anchor="middle" font-size="34" font-weight="800" fill="url(#brand)" letter-spacing="-1">GROQuiz</text>
    <text x="640" y="96" text-anchor="middle" font-size="15" fill="#94A3B8">Turn any PDF or text into a quiz you'll actually enjoy.</text>

    <!-- Status pill -->
    <rect x="499" y="122" width="282" height="30" rx="15" fill="#0B1C14" stroke="#14532D" stroke-width="1.5"/>
    <circle cx="517" cy="137" r="4" fill="#34D399"/>
    <text x="532" y="141" font-size="13" font-weight="600" fill="#6EE7B7">Groq ready — 3 keys connected</text>

    <!-- Mode cards -->
    <rect x="304" y="178" width="320" height="104" rx="20" fill="#1E293B" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="334" cy="210" r="16" fill="#0E7490"/>
    <text x="334" y="217" text-anchor="middle" font-size="16" fill="#22D3EE" font-weight="700">⚖</text>
    <text x="362" y="212" font-size="15" font-weight="700" fill="#E2E8F0">Balanced mode</text>
    <text x="362" y="236" font-size="12" fill="#94A3B8">Starts Medium and gets Easier/Harder</text>
    <text x="362" y="252" font-size="12" fill="#94A3B8">based on your answers.</text>
    <rect x="640" y="178" width="336" height="104" rx="20" fill="#1E293B" stroke="#334155" stroke-width="2"/>
    <circle cx="670" cy="210" r="16" fill="#4C1D28"/>
    <text x="670" y="217" text-anchor="middle" font-size="16" fill="#F87171" font-weight="700">🔒</text>
    <text x="698" y="212" font-size="15" font-weight="700" fill="#E2E8F0">Hard mode</text>
    <text x="698" y="236" font-size="12" fill="#94A3B8">Locked at Hard — no power-ups,</text>
    <text x="698" y="252" font-size="12" fill="#94A3B8">just you and the questions.</text>

    <!-- Time limit panel -->
    <rect x="304" y="306" width="672" height="110" rx="20" fill="#1A2333" stroke="#334155" stroke-width="1.5"/>
    <text x="328" y="338" font-size="12" font-weight="600" fill="#94A3B8">PICK YOUR TIME LIMIT PER QUESTION</text>
    <g font-size="14" font-weight="600">
      <rect x="328" y="352" width="64" height="38" rx="12" fill="#0B4660" stroke="#22D3EE" stroke-width="1.5"/>
      <text x="360" y="376" text-anchor="middle" fill="#67E8F9">15s</text>
      <rect x="402" y="352" width="64" height="38" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="434" y="376" text-anchor="middle" fill="#CBD5E1">30s</text>
      <rect x="476" y="352" width="64" height="38" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="508" y="376" text-anchor="middle" fill="#CBD5E1">45s</text>
      <rect x="550" y="352" width="64" height="38" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="582" y="376" text-anchor="middle" fill="#CBD5E1">60s</text>
      <rect x="624" y="352" width="64" height="38" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="656" y="376" text-anchor="middle" fill="#CBD5E1">90s</text>
    </g>
    <text x="698" y="375" font-size="11" fill="#64748B">Time out = marked wrong,</text>
    <text x="698" y="392" font-size="11" fill="#64748B">then a retry at the end.</text>

    <!-- Drop zone -->
    <rect x="304" y="440" width="672" height="150" rx="20" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="8 8" stroke-linecap="round"/>
    <circle cx="640" cy="490" r="22" fill="#164E63"/>
    <text x="640" y="497" text-anchor="middle" font-size="20" fill="#22D3EE">⬆</text>
    <text x="640" y="530" text-anchor="middle" font-size="15" font-weight="600" fill="#CBD5E1">Drag &amp; drop your PDF here</text>
    <text x="640" y="552" text-anchor="middle" font-size="12" fill="#64748B">PDF up to 4 MB — or paste text instead</text>
    <text x="640" y="576" text-anchor="middle" font-size="13" font-weight="600" fill="#22D3EE">or paste text instead</text>

    <!-- Paste panel -->
    <rect x="304" y="614" width="672" height="320" rx="20" fill="#1A2333" stroke="#334155" stroke-width="1.5"/>
    <text x="328" y="644" font-size="13" font-weight="600" fill="#E2E8F0">Your text</text>
    <rect x="328" y="656" width="624" height="110" rx="14" fill="#121A28" stroke="#334155" stroke-width="1.5"/>
    <text x="344" y="682" font-size="13" fill="#94A3B8">The heart pumps blood through the vessels…</text>
    <rect x="804" y="778" width="148" height="34" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="878" y="799" text-anchor="middle" font-size="12" font-weight="600" fill="#CBD5E1">Paste from clipboard</text>
    <text x="328" y="822" font-size="12" font-weight="600" fill="#94A3B8">TOPIC (OPTIONAL)</text>
    <rect x="328" y="832" width="624" height="48" rx="14" fill="#121A28" stroke="#334155" stroke-width="1.5"/>
    <text x="344" y="861" font-size="13" fill="#64748B">e.g. Cardiology · Oscillations · World War II</text>
    <rect x="328" y="896" width="624" height="24" rx="12" fill="url(#btnCyan)"/>
    <text x="640" y="912" text-anchor="middle" font-size="14" font-weight="700" fill="#061821">Generate quiz</text>

    <!-- History -->
    <text x="304" y="980" font-size="15" font-weight="700" fill="#E2E8F0">Recent quizzes</text>
    <g>
      <rect x="304" y="996" width="672" height="62" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="328" y="1024" font-size="14" font-weight="600" fill="#E2E8F0">Cardiology — heart &amp; circulation</text>
      <text x="328" y="1044" font-size="11" fill="#64748B">today · 5 Q · balanced · 1:12 avg</text>
      <rect x="852" y="1012" width="104" height="30" rx="14" fill="#0B1C14" stroke="#14532D" stroke-width="1.5"/>
      <text x="904" y="1031" text-anchor="middle" font-size="13" font-weight="700" fill="#34D399">80%</text>
      <rect x="304" y="1068" width="672" height="62" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="328" y="1096" font-size="14" font-weight="600" fill="#E2E8F0">Oscillations &amp; waves</text>
      <text x="328" y="1116" font-size="11" fill="#64748B">yesterday · 6 Q · hard · lock active</text>
      <rect x="852" y="1084" width="104" height="30" rx="14" fill="#211517" stroke="#7F1D1D" stroke-width="1.5"/>
      <text x="904" y="1103" text-anchor="middle" font-size="13" font-weight="700" fill="#F87171">50%</text>
    </g>

    <text x="640" y="1360" text-anchor="middle" font-size="11" fill="#475569">Built with Groq · GROQuiz</text>
  </g>
</svg>