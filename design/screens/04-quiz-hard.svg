<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="btnRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="900" fill="url(#glow)"/>
  <g font-family="Inter, Segoe UI, sans-serif">

    <!-- Top bar -->
    <g>
      <rect x="392" y="56" width="40" height="40" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="412" y="82" font-size="16" fill="#94A3B8">←</text>
      <text x="640" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#E2E8F0">Q3 / 10</text>
      <rect x="788" y="58" width="100" height="36" rx="12" fill="#2A1320" stroke="#9F1239" stroke-width="1.5"/>
      <text x="826" y="82" font-size="12" fill="#F87171">🔒 HARD</text>
    </g>

    <!-- Locked nav chips -->
    <g font-size="11" font-weight="600">
      <rect x="392" y="110" width="34" height="30" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="409" y="129" text-anchor="middle" fill="#64748B">1</text>
      <rect x="432" y="110" width="34" height="30" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="449" y="129" text-anchor="middle" fill="#64748B">2</text>
      <rect x="472" y="110" width="34" height="30" rx="10" fill="#3A1212" stroke="#B91C1C" stroke-width="1.5"/>
      <text x="489" y="129" text-anchor="middle" fill="#F87171">3</text>
      <rect x="512" y="110" width="34" height="30" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="529" y="133" text-anchor="middle" fill="#64748B">🔒</text>
      <rect x="552" y="110" width="34" height="30" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="569" y="133" text-anchor="middle" fill="#64748B">🔒</text>
      <rect x="592" y="110" width="34" height="30" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="609" y="133" text-anchor="middle" fill="#64748B">🔒</text>
      <text x="700" y="130" font-size="11" fill="#64748B" font-weight="500">locked order — no skipping ahead</text>
    </g>

    <!-- Question card -->
    <rect x="392" y="156" width="496" height="552" rx="20" fill="#1A2333" stroke="#B91C1C" stroke-width="1.5"/>

    <!-- Progress + timer -->
    <rect x="416" y="180" width="368" height="8" rx="4" fill="#122036"/>
    <rect x="416" y="180" width="184" height="8" rx="4" fill="#F87171"/>
    <text x="880" y="192" font-family="Consolas, monospace" font-size="22" font-weight="800" fill="#F87171" text-anchor="end">0:12</text>

    <!-- Hard tag -->
    <text x="416" y="226" font-size="11" font-weight="700" fill="#FB7185">HARD · 30 SECONDS · NO POWER-UPS</text>

    <!-- Question -->
    <text x="416" y="262" font-size="20" font-weight="700" fill="#E2E8F0">During intense exercise, which</text>
    <text x="416" y="290" font-size="20" font-weight="700" fill="#E2E8F0">
      process becomes most critical for <tspan fill="#FDE047" text-decoration="underline">muscles</tspan>?
    </text>

    <!-- Options -->
    <g>
      <rect x="416" y="322" width="448" height="62" rx="14" fill="#121A28" stroke="#334155" stroke-width="1.5"/>
      <circle cx="442" cy="353" r="13" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="442" y="358" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8">A</text>
      <text x="466" y="350" font-size="14" fill="#E2E8F0">Removal of carbon dioxide</text>
      <text x="466" y="369" font-size="13" fill="#94A3B8">from the bloodstream</text>

      <rect x="416" y="396" width="448" height="62" rx="14" fill="#121A28" stroke="#334155" stroke-width="1.5"/>
      <circle cx="442" cy="427" r="13" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="442" y="432" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8">B</text>
      <text x="466" y="424" font-size="14" fill="#E2E8F0">Regulation of heart rate</text>
      <text x="466" y="443" font-size="13" fill="#94A3B8">by the nervous system</text>

      <rect x="416" y="470" width="448" height="62" rx="14" fill="#0E2118" stroke="#14532D" stroke-width="1.5"/>
      <circle cx="442" cy="501" r="13" fill="#14532D" stroke="#34D399" stroke-width="1.5"/>
      <text x="442" y="506" text-anchor="middle" font-size="11" font-weight="700" fill="#6EE7B7">C</text>
      <text x="466" y="498" font-size="14" fill="#6EE7B7">Oxygen is supplied to active</text>
      <text x="466" y="517" font-size="13" fill="#A7F3D0">muscles for energy production</text>

      <rect x="416" y="544" width="448" height="62" rx="14" fill="#121A28" stroke="#334155" stroke-width="1.5"/>
      <circle cx="442" cy="575" r="13" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="442" y="580" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8">D</text>
      <text x="466" y="572" font-size="14" fill="#E2E8F0">Production of red blood cells</text>
      <text x="466" y="591" font-size="13" fill="#94A3B8">in the bone marrow</text>
    </g>

    <!-- Confirm -->
    <rect x="416" y="626" width="448" height="48" rx="14" fill="url(#btnRed)"/>
    <text x="640" y="655" text-anchor="middle" font-size="15" font-weight="700" fill="#3B0A0A">Confirm Answer</text>
  </g>
</svg>