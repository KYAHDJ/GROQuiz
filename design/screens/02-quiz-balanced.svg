<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="btnCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="900" fill="url(#glow)"/>
  <g font-family="Inter, Segoe UI, sans-serif">

    <!-- Top bar -->
    <g>
      <rect x="392" y="56" width="40" height="40" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="412" y="82" font-size="16" fill="#94A3B8">←</text>
      <text x="640" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#E2E8F0">Q3 / 10</text>
      <rect x="788" y="58" width="100" height="36" rx="12" fill="#0E2A33" stroke="#155E75" stroke-width="1.5"/>
      <text x="838" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#67E8F9">420</text>
    </g>

    <!-- Question card -->
    <rect x="392" y="116" width="496" height="640" rx="20" fill="#1A2333" stroke="#334155" stroke-width="1.5"/>

    <!-- Progress + timer -->
    <rect x="416" y="140" width="368" height="8" rx="4" fill="#122036"/>
    <rect x="416" y="140" width="184" height="8" rx="4" fill="#22D3EE"/>
    <text x="880" y="150" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#09B9CE" text-anchor="end">0:24</text>

    <!-- Tag -->
    <text x="416" y="182" font-size="11" font-weight="600" fill="#64748B">HINTS ACTIVE — SCORE DROPS 25% PER HINT</text>

    <!-- Question -->
    <text x="416" y="224" font-size="20" font-weight="700" fill="#E2E8F0">If a person's blood cannot</text>
    <text x="416" y="252" font-size="20" font-weight="700" fill="#E2E8F0">
      deliver <tspan fill="#FDE047" text-decoration="underline">oxygen</tspan> to <tspan fill="#FDE047" text-decoration="underline">tissues</tspan>,
    </text>
    <text x="416" y="280" font-size="20" font-weight="700" fill="#E2E8F0">which problem is most likely?</text>

    <!-- Hint box -->
    <rect x="416" y="304" width="448" height="56" rx="14" fill="#3A2F0B" stroke="#92400E" stroke-width="1.5"/>
    <circle cx="440" cy="332" r="12" fill="#B45309"/>
    <text x="440" y="337" text-anchor="middle" font-size="13" fill="#FDE68A">◇</text>
    <text x="462" y="329" font-size="12.5" fill="#FDE68A">The clue lives in the material's own reasoning —</text>
    <text x="462" y="347" font-size="12.5" fill="#FCD34D">follow the cause that transports oxygen around the body.</text>

    <!-- Options -->
    <g>
      <rect x="416" y="380" width="448" height="56" rx="14" fill="#121A28" stroke="#334155" stroke-width="1.5"/>
      <circle cx="442" cy="408" r="13" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="442" y="413" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8">A</text>
      <text x="466" y="413" font-size="14" fill="#E2E8F0">The vessels stop regenerating cells</text>

      <rect x="416" y="448" width="448" height="56" rx="14" fill="#0B3B4A" stroke="#22D3EE" stroke-width="2"/>
      <circle cx="442" cy="476" r="13" fill="#155E75" stroke="#22D3EE" stroke-width="1.5"/>
      <text x="442" y="481" text-anchor="middle" font-size="11" font-weight="700" fill="#A5F3FC">B</text>
      <text x="466" y="481" font-size="14" font-weight="600" fill="#A5F3FC">The heart cannot pump blood effectively</text>

      <rect x="416" y="516" width="448" height="46" rx="14" fill="#0F1721" stroke="#1E293B" stroke-width="1.5" opacity="0.55"/>
      <circle cx="442" cy="539" r="11" fill="#1A2233" stroke="#26516B" stroke-width="1"/>
      <text x="442" y="543" text-anchor="middle" font-size="9.5" font-weight="700" fill="#64748B">C</text>
      <text x="466" y="544" font-size="12" fill="#64748B">Carbon dioxide is stored in muscles</text>

      <rect x="416" y="574" width="448" height="56" rx="14" fill="#121A28" stroke="#334155" stroke-width="1.5"/>
      <circle cx="442" cy="602" r="13" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="442" y="607" text-anchor="middle" font-size="11" font-weight="700" fill="#94A3B8">D</text>
      <text x="466" y="607" font-size="14" fill="#E2E8F0">Vessels begin to contract on their own</text>
    </g>

    <!-- Power-ups -->
    <g font-size="12" font-weight="600">
      <rect x="416" y="652" width="140" height="36" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="432" y="675" fill="#FBBF24">⚡</text>
      <text x="452" y="675" fill="#CBD5E1">50/50</text>
      <text x="524" y="675" fill="#64748B">×3</text>
      <rect x="564" y="652" width="140" height="36" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="580" y="675" fill="#22D3EE">◷</text>
      <text x="600" y="675" fill="#CBD5E1">Freeze 15s</text>
      <text x="672" y="675" fill="#64748B">×2</text>
      <rect x="712" y="652" width="152" height="36" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
      <text x="728" y="675" fill="#A78BFA">◇</text>
      <text x="748" y="675" fill="#CBD5E1">AI Clarifier</text>
      <text x="828" y="675" fill="#64748B">×1</text>
    </g>

    <!-- Confirm -->
    <rect x="416" y="708" width="448" height="48" rx="14" fill="url(#btnCyan)"/>
    <text x="640" y="737" text-anchor="middle" font-size="15" font-weight="700" fill="#061821">Confirm Answer</text>

    <!-- 50/50 active banner alternative -->
    <rect x="392" y="792" width="496" height="34" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="640" y="814" text-anchor="middle" font-size="11.5" fill="#94A3B8">⚡ Two options are out — one of the two remaining is correct, you choose.</text>
  </g>
</svg>