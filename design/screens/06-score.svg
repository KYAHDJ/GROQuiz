<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="btnCyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#312E5C"/>
      <stop offset="100%" stop-color="#1A2333"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="900" fill="url(#glow)"/>
  <g font-family="Inter, Segoe UI, sans-serif">

    <text x="640" y="72" text-anchor="middle" font-size="28" font-weight="800" fill="#E2E8F0">Quiz complete! 🎉</text>
    <text x="640" y="100" text-anchor="middle" font-size="13" fill="#94A3B8">Balanced · Cardiology — heart &amp; circulation</text>

    <!-- Score ring -->
    <circle cx="640" cy="230" r="80" fill="none" stroke="#16202F" stroke-width="14"/>
    <circle cx="640" cy="230" r="80" fill="none" stroke="#22D3EE" stroke-width="14" stroke-linecap="round"
            stroke-dasharray="377" stroke-dashoffset="68" transform="rotate(-90 640 230)"/>
    <rect x="572" y="180" width="136" height="100" rx="16" fill="#0F172A"/>
    <text x="640" y="228" text-anchor="middle" font-family="Consolas, monospace" font-size="30" font-weight="800" fill="#67E8F9">980</text>
    <text x="640" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#64748B">of 1,000 · 98%</text>

    <!-- Stat chips -->
    <g>
      <rect x="304" y="348" width="150" height="66" rx="16" fill="#1A2333" stroke="#334155" stroke-width="1.5"/>
      <text x="379" y="376" text-anchor="middle" font-size="18" font-weight="800" fill="#34D399">82%</text>
      <text x="379" y="398" text-anchor="middle" font-size="11" fill="#64748B">Accuracy</text>

      <rect x="466" y="348" width="150" height="66" rx="16" fill="#1A2333" stroke="#334155" stroke-width="1.5"/>
      <text x="541" y="376" text-anchor="middle" font-size="18" font-weight="800" fill="#FBBF24">6</text>
      <text x="541" y="398" text-anchor="middle" font-size="11" fill="#64748B">Best streak</text>

      <rect x="628" y="348" width="150" height="66" rx="16" fill="#1A2333" stroke="#334155" stroke-width="1.5"/>
      <text x="703" y="376" text-anchor="middle" font-size="18" font-weight="800" fill="#22D3EE">41s</text>
      <text x="703" y="398" text-anchor="middle" font-size="11" fill="#64748B">Avg time</text>

      <rect x="790" y="348" width="186" height="66" rx="16" fill="#1A2333" stroke="#334155" stroke-width="1.5"/>
      <text x="883" y="376" text-anchor="middle" font-size="18" font-weight="800" fill="#A78BFA">10</text>
      <text x="883" y="398" text-anchor="middle" font-size="11" fill="#64748B">Questions</text>
    </g>

    <!-- Weak areas -->
    <text x="640" y="462" text-anchor="middle" font-size="13" font-weight="600" fill="#94A3B8">Weak areas you should revisit:</text>
    <g>
      <rect x="430" y="478" width="190" height="34" rx="12" fill="#211515" stroke="#7F1D1D" stroke-width="1.5"/>
      <text x="525" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#FCA5A5">CO₂ transport</text>
      <rect x="632" y="478" width="224" height="34" rx="12" fill="#211515" stroke="#7F1D1D" stroke-width="1.5"/>
      <text x="744" y="500" text-anchor="middle" font-size="12" font-weight="600" fill="#FCA5A5">Electrical conduction</text>
    </g>

    <!-- AI Coach -->
    <rect x="304" y="540" width="672" height="150" rx="20" fill="url(#violet)" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="330" y="574" font-size="20" fill="#C4B5FD">✦</text>
    <text x="358" y="574" font-size="14.5" font-weight="800" fill="#DDD6FE">AI Coach</text>
    <text x="358" y="596" font-size="11" font-weight="600" fill="#A78BFA">SUGGESTION FOR YOUR WRONG ANSWERS</text>
    <text x="330" y="622" font-size="12.5" fill="#DDD6FE">You kept mixing up what blood carries TO tissues vs. AWAY from them.</text>
    <text x="330" y="642" font-size="12.5" fill="#DDD6FE">Remember the flow: heart pumps blood <tspan font-weight="700" fill="#C4B5FD">in</tspan> with oxygen, and</text>
    <text x="330" y="662" font-size="12.5" fill="#DDD6FE">carries carbon dioxide <tspan font-weight="700" fill="#C4B5FD">out</tspan>. Re-read the passage and try again.</text>
    <rect x="830" y="660" width="120" height="30" rx="12" fill="#4C1D95" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="890" y="679" text-anchor="middle" font-size="11" font-weight="700" fill="#DDD6FE">↻ Refresh</text>

    <!-- Buttons -->
    <rect x="440" y="724" width="190" height="48" rx="14" fill="url(#btnCyan)"/>
    <text x="535" y="753" text-anchor="middle" font-size="14.5" font-weight="700" fill="#061821">Try the quiz again</text>
    <rect x="650" y="724" width="190" height="48" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>
    <text x="745" y="753" text-anchor="middle" font-size="14.5" font-weight="600" fill="#CBD5E1">New quiz</text>

    <text x="640" y="860" text-anchor="middle" font-size="11" fill="#475569">Built with Groq · GROQuiz</text>
  </g>
</svg>